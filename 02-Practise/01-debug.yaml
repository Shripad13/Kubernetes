# If developer wants to debug some pod with config added 

# Create standalone pod with some custom config
#Option1
kubectl run debug-myapp \
  --image=myapp:latest \
  --env="LOG_LEVEL=denug" \
  --restart=Never

  #Option2-
  apiVersion: v1
  kind: Pod
  metadata:
    name: debug-myapp
  spec:
    - name: myapp
      image: myapp:latest
      env:
        - name: LOG_LEVEL
          value: debug